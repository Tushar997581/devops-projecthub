services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudmart-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - cloudmart-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: cloudmart-backend

    restart: unless-stopped

    env_file:
      - backend/.env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "5000:5000"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - cloudmart-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: cloudmart-frontend

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "3000:80"

    networks:
      - cloudmart-network

volumes:
  postgres-data:

networks:
  cloudmart-network:
    driver: bridge