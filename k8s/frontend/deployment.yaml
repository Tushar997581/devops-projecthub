apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: cloudmart

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: YOUR_FRONTEND_ECR_REPOSITORY:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"